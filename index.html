<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Sinh nhật Dương Gia Bảo — 24/05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pink:#ec4899;--pink-2:#f472b6;--purple:#8b5cf6;--gold:#fbbf24;--blue:#60a5fa;
  --text:#1f2937;--text-muted:#6b7280;
  --glass:rgba(255,255,255,.72);--glass-border:rgba(255,255,255,.55);
  --shadow:0 30px 60px -20px rgba(80,20,80,.35);
}
body.birthday-mode{--pink:#f43f5e;--purple:#c026d3;--gold:#facc15}
*{-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Poppins',system-ui,sans-serif;color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:130px 16px 60px;overflow-x:hidden;
  background:linear-gradient(140deg,#667eea,#764ba2 45%,#ec4899 100%);
  background-size:300% 300%;
  animation:bgShift 18s ease infinite;
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body.birthday-mode{background:linear-gradient(140deg,#f472b6,#a855f7 45%,#fbbf24 100%);background-size:300% 300%}

.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:orbFloat 20s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#f472b6;top:-80px;left:-80px}
.orb.b{width:300px;height:300px;background:#8b5cf6;bottom:-80px;right:-60px;animation-delay:-6s}
.orb.c{width:260px;height:260px;background:#fbbf24;top:40%;right:20%;animation-delay:-12s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.1)}}

.balloons{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.balloon{
  position:absolute;width:42px;height:56px;border-radius:50% 50% 48% 48%;left:var(--x);
  animation:floatUp var(--dur) linear infinite;animation-delay:var(--delay);
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.15));
}
.balloon::before{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:2px;height:8px;background:rgba(0,0,0,.25);border-radius:2px}
.balloon::after{content:'';position:absolute;top:6px;left:10px;width:10px;height:14px;background:rgba(255,255,255,.5);border-radius:50%;filter:blur(2px)}
@keyframes floatUp{0%{transform:translateY(115vh) rotate(-6deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-25vh) rotate(6deg);opacity:0}}

#confetti-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}

.card{
  position:relative;z-index:20;width:100%;max-width:720px;margin:auto 0;
  background:var(--glass);border:1.5px solid var(--glass-border);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:36px;padding:56px 26px 30px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);
  text-align:center;animation:cardIn 1s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{opacity:0;transform:scale(.9) translateY(30px)}to{opacity:1;transform:none}}

.top-controls{position:absolute;top:16px;right:18px;display:flex;gap:8px;z-index:5}
.icon-btn{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.7);
  color:#4c1d95;cursor:pointer;display:grid;place-items:center;font-size:14px;
  transition:all .25s;backdrop-filter:blur(10px);
}
.icon-btn:hover{transform:translateY(-2px) rotate(8deg);background:#fff;color:var(--pink)}
.icon-btn.off{opacity:.5}

.avatar-wrap{position:relative;width:150px;height:150px;margin:-128px auto 16px}
.avatar-wrap::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  background:conic-gradient(from 0deg,#ec4899,#8b5cf6,#fbbf24,#ec4899);
  animation:spin 4s linear infinite;z-index:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 15px 30px -10px rgba(0,0,0,.3);transition:transform .4s}
.avatar-wrap:hover .avatar{transform:scale(1.06) rotate(3deg)}

h1{
  font-family:'Dancing Script',cursive;font-size:3.4rem;font-weight:700;
  background:linear-gradient(135deg,var(--pink),var(--purple),var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.05;margin-bottom:6px;
}
.sub{
  display:inline-flex;align-items:center;gap:8px;padding:8px 22px;border-radius:999px;
  background:rgba(255,255,255,.65);border:1.5px solid rgba(255,255,255,.8);
  color:var(--pink);font-weight:700;font-size:1rem;letter-spacing:1px;
  box-shadow:0 6px 16px -6px rgba(236,72,153,.4);margin-bottom:24px;
}
.bday-banner{
  display:none;margin:0 0 20px;padding:14px 20px;border-radius:18px;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-weight:700;
  box-shadow:0 10px 25px -8px rgba(245,158,11,.6);
  animation:pulseBanner 1.6s ease-in-out infinite;
}
body.birthday-mode .bday-banner{display:block}
@keyframes pulseBanner{50%{transform:scale(1.02)}}

.countdown{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:8px 0 18px}
.time-block{
  background:linear-gradient(145deg,#ec4899,#a855f7);color:#fff;
  padding:14px 10px;border-radius:22px;min-width:92px;
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 15px 30px -12px rgba(168,85,247,.55),inset 0 -3px 6px rgba(0,0,0,.1);
  transition:transform .3s;position:relative;overflow:hidden;
}
.time-block::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none}
.time-block:hover{transform:translateY(-6px) scale(1.03)}
.time-block .num{display:block;font-size:2.8rem;font-weight:800;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.time-block .num.flip{animation:flipNum .5s ease}
@keyframes flipNum{0%{transform:rotateX(-90deg) scale(.6);opacity:0}100%{transform:rotateX(0) scale(1);opacity:1}}
.time-block .lbl{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:2px;font-weight:600;opacity:.9;margin-top:6px}

.progress-wrap{margin:20px 0 16px;padding:14px 18px;background:rgba(255,255,255,.55);border-radius:20px;border:1.5px solid rgba(255,255,255,.7)}
.progress-label{display:flex;justify-content:space-between;font-size:.78rem;font-weight:600;color:#7c3aed;margin-bottom:8px}
.progress-track{height:10px;background:rgba(139,92,246,.18);border-radius:999px;overflow:hidden;position:relative}
.progress-fill{
  height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--purple));
  background-size:200% 100%;animation:progressShine 3s linear infinite;
  transition:width 1s ease;box-shadow:0 0 12px rgba(236,72,153,.55);
}
@keyframes progressShine{to{background-position:200% 0}}

.greeting{
  background:rgba(255,255,255,.6);border:2px dashed var(--pink-2);
  border-radius:22px;padding:18px 22px;margin:14px 0 22px;
  font-size:1.08rem;font-weight:500;color:#4c1d95;min-height:70px;
  display:grid;place-items:center;box-shadow:inset 0 0 20px rgba(236,72,153,.12);
}
.greeting.big{
  background:linear-gradient(135deg,#ffe4f1,#fce7f3);
  border-style:solid;border-color:#f9a8d4;
  font-size:1.5rem;font-weight:700;color:var(--pink);
  animation:pulseGreeting 1.6s ease-in-out infinite;
}
@keyframes pulseGreeting{50%{transform:scale(1.02)}}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--pink);vertical-align:middle;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.gift{margin:22px auto 8px;width:110px;height:110px;cursor:pointer;display:grid;place-items:center;font-size:64px;transition:transform .3s;filter:drop-shadow(0 12px 20px rgba(236,72,153,.4));user-select:none;position:relative}
.gift:hover{transform:scale(1.08) rotate(-4deg)}
.gift.opened{animation:giftPop .6s ease}
@keyframes giftPop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(8deg)}70%{transform:scale(.95) rotate(-4deg)}100%{transform:scale(1)}}
.gift-hint{font-size:.82rem;color:#7c3aed;font-weight:600;opacity:.75;margin-bottom:16px}
.gift-message{display:none;margin:16px auto 0;padding:18px 22px;max-width:520px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #fbbf24;border-radius:22px;font-size:1.05rem;color:#78350f;font-weight:600;line-height:1.5;box-shadow:0 15px 30px -15px rgba(251,191,36,.7)}
.gift-message.show{display:block;animation:cardIn .6s ease}

.wish-box{margin:22px 0 20px;padding:18px;background:rgba(255,255,255,.55);border-radius:22px;border:1.5px solid rgba(255,255,255,.7);text-align:left}
.wish-title{font-weight:700;color:#7c3aed;font-size:.95rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.wish-input-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wish-input-row input{flex:1;min-width:100px;padding:11px 16px;border-radius:14px;border:1.5px solid rgba(168,85,247,.25);background:#fff;font-family:inherit;font-size:.9rem;color:var(--text);outline:none;transition:all .2s}
.wish-input-row input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(236,72,153,.15)}
.wish-input-row button{padding:0 20px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;transition:transform .2s;box-shadow:0 8px 16px -6px rgba(236,72,153,.5);min-height:42px}
.wish-input-row button:hover{transform:translateY(-2px)}
.wish-list{max-height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.wish-list::-webkit-scrollbar{width:6px}
.wish-list::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:3px}
.wish-item{padding:9px 14px;background:rgba(255,255,255,.75);border-radius:14px;font-size:.86rem;border-left:3px solid var(--pink);animation:cardIn .35s ease}
.wish-item b{color:#7c3aed}
.wish-empty{font-size:.82rem;color:var(--text-muted);text-align:center;padding:8px}

.player{display:flex;align-items:center;gap:10px;padding:12px 16px;margin:20px 0 16px;background:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 12px 25px -12px rgba(139,92,246,.35);flex-wrap:wrap}
.player button{width:40px;height:40px;border-radius:50%;border:none;background:rgba(168,85,247,.12);color:#7c3aed;cursor:pointer;display:grid;place-items:center;font-size:14px;transition:all .2s;flex-shrink:0}
.player button:hover{background:var(--purple);color:#fff;transform:scale(1.08)}
.player button.play{width:48px;height:48px;font-size:16px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 10px 20px -6px rgba(168,85,247,.6)}
.player-info{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.song-title{font-size:.85rem;font-weight:600;color:#4c1d95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{height:6px;background:rgba(168,85,247,.18);border-radius:999px;position:relative;cursor:pointer}
.seek-fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:999px;pointer-events:none;transition:width .15s linear}
.seek-time{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-muted);font-weight:500;margin-top:2px}
.vol-wrap{display:flex;align-items:center;gap:6px;background:rgba(168,85,247,.1);border-radius:999px;padding:5px 10px}
.vol-wrap button{width:26px;height:26px;font-size:12px;background:transparent}
.vol-slider{-webkit-appearance:none;appearance:none;width:70px;height:4px;border-radius:2px;background:rgba(168,85,247,.3);outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--purple);cursor:pointer}
.vol-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--purple);cursor:pointer;border:none}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 8px}
.act-btn{padding:11px 22px;border-radius:999px;border:1.5px solid rgba(255,255,255,.8);background:rgba(255,255,255,.7);color:#7c3aed;font-family:inherit;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .25s}
.act-btn:hover{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;transform:translateY(-2px);box-shadow:0 12px 22px -8px rgba(168,85,247,.55);border-color:transparent}
.act-btn.active{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent}

footer{margin-top:22px;font-size:.82rem;color:#6b7280;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
footer i{color:var(--pink);animation:heartBeat 1.4s infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,15,50,.92);color:#fff;padding:12px 24px;border-radius:999px;font-size:.88rem;font-weight:600;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:520px){
  body{padding:105px 14px 50px}
  .card{padding:46px 16px 22px;border-radius:28px}
  h1{font-size:2.6rem}
  .avatar-wrap{width:120px;height:120px;margin-top:-104px}
  .time-block{min-width:70px;padding:10px 6px;border-radius:18px}
  .time-block .num{font-size:2rem}
  .time-block .lbl{font-size:.6rem;letter-spacing:1px}
  .greeting{font-size:.95rem;padding:14px 16px}
  .greeting.big{font-size:1.15rem}
  .player{padding:10px 12px;gap:8px}
  .vol-wrap{display:none}
  .gift{font-size:52px;width:90px;height:90px}
  .top-controls{top:12px;right:12px;gap:6px}
  .icon-btn{width:34px;height:34px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="orbs">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
</div>

<div class="balloons" id="balloons"></div>
<canvas id="confetti-canvas"></canvas>

<main class="card">
  <div class="top-controls">
    <button class="icon-btn" id="soundToggle" title="Bật/tắt âm thanh tương tác"><i class="fas fa-volume-high"></i></button>
    <button class="icon-btn" id="shareBtn" title="Chia sẻ"><i class="fas fa-share-nodes"></i></button>
  </div>

  <div class="avatar-wrap">
    <img src="https://i.ibb.co/23ByT0sb/1000183171.png" alt="Dương Gia Bảo" class="avatar" id="avatarImg">
  </div>

  <h1>Dương Gia Bảo</h1>
  <div class="sub">🎂 24 / 05 🎂</div>

  <div class="bday-banner">🎉 HÔM NAY LÀ SINH NHẬT CỦA BẢO! CHÚC MỪNG SINH NHẬT! 🎂</div>

  <div class="countdown" id="countdown">
    <div class="time-block"><span class="num" id="days">0</span><span class="lbl">Ngày</span></div>
    <div class="time-block"><span class="num" id="hours">0</span><span class="lbl">Giờ</span></div>
    <div class="time-block"><span class="num" id="minutes">0</span><span class="lbl">Phút</span></div>
    <div class="time-block"><span class="num" id="seconds">0</span><span class="lbl">Giây</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressLabelLeft">⏳ Đang đếm ngược</span>
      <span id="progressLabelRight">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="greeting" id="greeting"></div>

  <div class="gift" id="giftBox" title="Nhấn để mở quà">🎁</div>
  <div class="gift-hint" id="giftHint">Chạm vào hộp quà để xem điều bất ngờ!</div>
  <div class="gift-message" id="giftMessage"></div>

  <div class="wish-box">
    <div class="wish-title"><i class="fas fa-heart"></i> Gửi lời chúc đến Bảo</div>
    <div class="wish-input-row">
      <input type="text" id="wishName" maxlength="24" placeholder="Tên bạn...">
      <input type="text" id="wishText" maxlength="120" placeholder="Lời chúc...">
      <button id="wishSend"><i class="fas fa-paper-plane"></i></button>
    </div>
    <div class="wish-list" id="wishList"></div>
  </div>

  <div class="player">
    <button id="prevBtn" title="Bài trước"><i class="fas fa-backward-step"></i></button>
    <button id="playBtn" class="play" title="Phát / Tạm dừng"><i class="fas fa-play"></i></button>
    <button id="nextBtn" title="Bài tiếp"><i class="fas fa-forward-step"></i></button>
    <div class="player-info">
      <div class="song-title" id="songTitle">Chưa chọn bài</div>
      <div class="seek" id="seekBar"><div class="seek-fill" id="seekFill"></div></div>
      <div class="seek-time"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>
    <button id="shuffleBtn" title="Ngẫu nhiên"><i class="fas fa-shuffle"></i></button>
    <div class="vol-wrap">
      <button id="volBtn"><i class="fas fa-volume-high"></i></button>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="0.7">
    </div>
  </div>

  <div class="actions">
    <button class="act-btn active" id="confettiBtn"><i class="fas fa-star"></i> Confetti</button>
    <button class="act-btn" id="burstBtn"><i class="fas fa-burst"></i> Bắn pháo hoa</button>
    <button class="act-btn" id="musicBirthdayBtn"><i class="fas fa-cake-candles"></i> Nhạc sinh nhật</button>
  </div>

  <footer>
    <i class="fas fa-heart"></i>
    Chúc Bảo một ngày sinh nhật thật ý nghĩa và tràn đầy niềm vui!
  </footer>
</main>

<audio id="bgAudio" preload="none" playsinline webkit-playsinline></audio>

<script>
(function(){
  'use strict';

  /* ================== CONFIG ================== */
  const CONFIG = { birthdayMonth: 4, birthdayDay: 24, name: 'Dương Gia Bảo' };

  const REGULAR_SONGS = [
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/B%C3%A0i%20N%C3%A0y%20Chill%20Ph%E1%BA%BFt%20-%20%C4%90en.mp3", title:"Bài Này Chill Phết — Đen"},
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/C%E1%BB%A9%20Chill%20Th%C3%B4i%20-%20Chillies.mp3", title:"Cứ Chill Thôi — Chillies"},
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/M%C3%B9a%20H%C3%A8%20N%C4%83m%20%C4%90%C3%B3%20-%20B%20Ray.mp3", title:"Mùa Hè Năm Đó — B Ray"},
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/Tell%20the%20kids%20i%20love%20them%20-%20Obito.mp3", title:"Tell the Kids I Love Them — Obito"},
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/Xu%E1%BA%A5t%20Ph%C3%A1t%20%C4%90i%E1%BB%83m%20-%20Obito.mp3", title:"Xuất Phát Điểm — Obito"}
  ];
  const BIRTHDAY_SONGS = [
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/Happy%20Birthday%20To%20You%20-%20AMEE.mp3", title:"Happy Birthday To You — AMEE"},
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/Kh%C3%BAc%20H%C3%A1t%20M%E1%BB%ABng%20Sinh%20Nh%E1%BA%ADt%20-%20Phan%20%C4%90inh%20T%C3%B9ng.mp3", title:"Khúc Hát Mừng Sinh Nhật — Phan Đinh Tùng"},
    {url:"https://github.com/baobao247/2405/raw/refs/heads/main/SINH%20NHAT%20-%20HIEUTHUHAI.mp3", title:"SINH NHẬT — HIEUTHUHAI"}
  ];

  /* ================== UTILS ================== */
  const $ = id => document.getElementById(id);
  const rand = (min, max) => Math.random() * (max - min) + min;
  const isBirthdayToday = () => {
    const t = new Date();
    return t.getDate() === CONFIG.birthdayDay && t.getMonth() === CONFIG.birthdayMonth;
  };
  const pad = n => String(n).padStart(2, '0');
  const fmtTime = s => {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const ss = Math.floor(s % 60);
    return `${m}:${pad(ss)}`;
  };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const debounce = (fn, ms) => { let t; return function(...a){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,a), ms); }; };

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ================== SFX (Web Audio) ================== */
  let sfxOn = true;
  let audioCtx = null;
  function beep(freq, dur, type){
    if (!sfxOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = 0.06;
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.08));
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + (dur || 0.08));
    } catch(e){}
  }

  /* ================== BIRTHDAY MODE ================== */
  if (isBirthdayToday()) document.body.classList.add('birthday-mode');

  /* ================== BALLOONS ================== */
  (function(){
    const colors = ['#f472b6','#a855f7','#fbbf24','#60a5fa','#34d399','#fb7185','#c084fc'];
    const wrap = $('balloons');
    for (let i = 0; i < 7; i++){
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.setProperty('--x', rand(2, 94) + '%');
      b.style.setProperty('--dur', rand(12, 22) + 's');
      b.style.setProperty('--delay', (-rand(0, 20)) + 's');
      const c = colors[i % colors.length];
      b.style.background = `radial-gradient(circle at 35% 30%, #fff 0%, ${c} 55%, ${c} 100%)`;
      wrap.appendChild(b);
    }
  })();

  /* ================== CONFETTI ================== */
  const canvas = $('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], rafId = null, confettiOn = true;

  function resizeCanvas(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  const SHAPES = ['rect','circle','heart','star','ribbon'];

  function makeParticle(x, y, burst){
    return {
      x: x ?? Math.random() * W,
      y: y ?? (burst ? H + 10 : Math.random() * H - H),
      vx: rand(-2, 2) + (burst ? rand(-6, 6) : 0),
      vy: burst ? rand(-14, -6) : rand(2, 6),
      size: rand(5, 12),
      color: `hsl(${rand(0, 360)}, 85%, 62%)`,
      rot: rand(0, Math.PI * 2),
      rotSpd: rand(-0.08, 0.08),
      shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
      life: burst ? rand(60, 120) : Infinity,
      wobble: rand(0, Math.PI * 2),
      wobbleSpd: rand(0.02, 0.06)
    };
  }
  function initParticles(count){ particles = []; for (let i = 0; i < count; i++) particles.push(makeParticle()); }

  function drawHeart(p){
    const s = p.size;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(0, 0, -s / 2, 0, -s / 2, s * 0.3);
    ctx.bezierCurveTo(-s / 2, s * 0.75, 0, s, 0, s * 1.2);
    ctx.bezierCurveTo(0, s, s / 2, s * 0.75, s / 2, s * 0.3);
    ctx.bezierCurveTo(s / 2, 0, 0, 0, 0, s * 0.3);
    ctx.fill();
  }
  function drawStar(p){
    const s = p.size / 2, spikes = 5;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++){
      const r = i % 2 === 0 ? s : s * 0.45;
      const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  }

  function stepParticles(){
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.wobble += p.wobbleSpd;
      p.x += p.vx + Math.sin(p.wobble) * 0.6;
      p.y += p.vy;
      p.rot += p.rotSpd;

      if (p.life !== undefined){
        p.vy += 0.35;
        p.vx *= 0.99;
        p.life--;
        if (p.life <= 0 || p.y > H + 40){ particles.splice(i, 1); continue; }
      } else if (p.y > H + 20){ p.y = -20; p.x = Math.random() * W; }
      if (p.x > W + 20) p.x = -20;
      if (p.x < -20) p.x = W + 20;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.shadowColor = 'rgba(0,0,0,.15)';
      ctx.shadowBlur = 6;

      if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.shape === 'circle'){ ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      else if (p.shape === 'heart') drawHeart(p);
      else if (p.shape === 'star') drawStar(p);
      else if (p.shape === 'ribbon'){
        ctx.beginPath();
        ctx.moveTo(-p.size, 0);
        ctx.quadraticCurveTo(0, -p.size / 2, p.size, 0);
        ctx.quadraticCurveTo(0, p.size / 4, -p.size, 0);
        ctx.fill();
      }
      ctx.restore();
    }
    rafId = requestAnimationFrame(stepParticles);
  }
  function startConfetti(){ if (!rafId) rafId = requestAnimationFrame(stepParticles); }
  function stopConfetti(){ if (rafId){ cancelAnimationFrame(rafId); rafId = null; } ctx.clearRect(0, 0, W, H); }
  function burstAt(x, y, n){ for (let i = 0; i < (n || 40); i++) particles.push(makeParticle(x, y, true)); if (!rafId) startConfetti(); }

  /* ================== COUNTDOWN ================== */
  function getNextBirthday(now){
    const y = now.getFullYear();
    let t = new Date(y, CONFIG.birthdayMonth, CONFIG.birthdayDay, 0, 0, 0, 0);
    if (now > t) t = new Date(y + 1, CONFIG.birthdayMonth, CONFIG.birthdayDay, 0, 0, 0, 0);
    return t;
  }
  function getPrevBirthday(now){
    const y = now.getFullYear();
    let t = new Date(y, CONFIG.birthdayMonth, CONFIG.birthdayDay, 0, 0, 0, 0);
    if (now < t) t = new Date(y - 1, CONFIG.birthdayMonth, CONFIG.birthdayDay, 0, 0, 0, 0);
    return t;
  }
  function setNum(el, value){
    const str = String(value);
    if (el.textContent === str) return;
    el.textContent = str;
    el.classList.remove('flip');
    void el.offsetWidth;
    el.classList.add('flip');
  }
  function updateCountdown(){
    const now = new Date();
    const target = getNextBirthday(now);
    const diff = target - now;

    if (diff <= 0){
      setNum($('days'), 0); setNum($('hours'), 0); setNum($('minutes'), 0); setNum($('seconds'), 0);
      $('greeting').className = 'greeting big';
      $('greeting').textContent = '🎉🎂 Hôm nay là sinh nhật của Bảo! 🎂🎉';
      $('progressFill').style.width = '100%';
      $('progressLabelRight').textContent = '100%';
      $('progressLabelLeft').textContent = '🎉 Đến ngày rồi!';
      return;
    }
    const secs = Math.floor(diff / 1000);
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;

    setNum($('days'), d);
    setNum($('hours'), pad(h));
    setNum($('minutes'), pad(m));
    setNum($('seconds'), pad(s));

    const prev = getPrevBirthday(now);
    const total = target - prev;
    const elapsed = now - prev;
    const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
    $('progressFill').style.width = pct.toFixed(2) + '%';
    $('progressLabelRight').textContent = pct.toFixed(1) + '%';
    $('progressLabelLeft').textContent = `⏳ Còn ${d} ngày ${h} giờ`;

    const g = $('greeting');
    if (g.dataset.typed === '1') return;

    let msg;
    if (d === 0 && h < 6) msg = `🚀 Chỉ còn ${h} giờ ${m} phút nữa thôi!`;
    else if (d === 0) msg = `🎈 Hôm nay rồi! Cùng đếm ngược nào!`;
    else if (d < 7) msg = `🎁 Chỉ còn ${d} ngày nữa là sinh nhật của Bảo!`;
    else if (d < 30) msg = `🎂 Còn ${d} ngày nữa là đến 24/05. Sắp rồi!`;
    else msg = `✨ Còn ${d} ngày nữa là tới sinh nhật Bảo — hãy cùng đón chờ nhé!`;

    if (!g.textContent || g.textContent === '⏳ Đang chuẩn bị...'){
      typewriter(g, msg);
      g.dataset.typed = '1';
    }
  }
  function typewriter(el, text, speed){
    speed = speed || 45;
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    let i = 0;
    (function tick(){
      if (i < text.length){
        el.insertBefore(document.createTextNode(text[i++]), cursor);
        setTimeout(tick, speed);
      } else setTimeout(() => cursor.remove(), 1200);
    })();
  }

  /* ================== GIFT BOX ================== */
  const GIFTS = [
    "🎉 Điều bất ngờ đầu tiên: Bảo là một người tuyệt vời và xứng đáng được yêu thương!",
    "💖 Điều bất ngờ thứ hai: Hãy luôn mỉm cười, vì nụ cười của Bảo làm sáng cả một vùng trời!",
    "🌟 Bí mật nhỏ: Hôm nay có người nhớ Bảo rất nhiều đó nha!",
    "🍰 Điều ước dành cho Bảo: Mọi điều tốt đẹp nhất sẽ đến với bạn trong tuổi mới!",
    "🎁 Món quà tinh thần: Một năm mới tràn đầy sức khỏe, niềm vui và những dự định thành công!"
  ];
  const gift = $('giftBox'), giftMsg = $('giftMessage');
  let giftIndex = 0;
  gift.addEventListener('click', () => {
    gift.classList.add('opened');
    setTimeout(() => gift.classList.remove('opened'), 600);
    giftMsg.textContent = GIFTS[giftIndex % GIFTS.length];
    giftMsg.classList.add('show');
    giftIndex++;
    beep(880, 0.1, 'triangle');
    setTimeout(() => beep(1175, 0.12, 'triangle'), 100);
    const rect = gift.getBoundingClientRect();
    burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 60);
    $('giftHint').textContent = 'Bấm lại để nhận điều bất ngờ khác ✨';
  });

  /* ================== WISHES ================== */
  const WISH_KEY = 'dgb_wishes_v1';
  let wishes = [];
  try { wishes = JSON.parse(localStorage.getItem(WISH_KEY)) || []; } catch(e){}

  function renderWishes(){
    const list = $('wishList');
    if (!wishes.length){ list.innerHTML = '<div class="wish-empty">Chưa có lời chúc nào — hãy là người đầu tiên! 💌</div>'; return; }
    list.innerHTML = wishes.slice(-20).reverse().map(w =>
      `<div class="wish-item"><b>${escapeHtml(w.name)}:</b> ${escapeHtml(w.text)}</div>`
    ).join('');
  }
  $('wishSend').addEventListener('click', () => {
    const nameEl = $('wishName'), textEl = $('wishText');
    const name = nameEl.value.trim() || 'Ẩn danh';
    const text = textEl.value.trim();
    if (!text){ toast('Bạn chưa nhập lời chúc 🙏'); textEl.focus(); return; }
    wishes.push({ name, text, t: Date.now() });
    try { localStorage.setItem(WISH_KEY, JSON.stringify(wishes)); } catch(e){}
    textEl.value = '';
    renderWishes();
    toast('Đã gửi lời chúc 💖');
    beep(1046, 0.09, 'sine');
    setTimeout(() => beep(1318, 0.12, 'sine'), 90);
    const r = $('wishSend').getBoundingClientRect();
    burstAt(r.left, r.top, 25);
  });
  $('wishText').addEventListener('keydown', e => { if (e.key === 'Enter') $('wishSend').click(); });
  renderWishes();

  /* ================== MUSIC PLAYER (ĐƠN GIẢN — CHẮC CHẠY) ================== */
  const audio = $('bgAudio');
  let songs = (isBirthdayToday() ? BIRTHDAY_SONGS : REGULAR_SONGS).slice();
  let currentIdx = 0;
  let shuffle = false;
  let userVolume = parseFloat(localStorage.getItem('dgb_volume'));
  if (isNaN(userVolume) || userVolume < 0 || userVolume > 1) userVolume = 0.7;
  audio.volume = userVolume;
  $('volSlider').value = userVolume;

  function updatePlayIcon(){
    $('playBtn').innerHTML = audio.paused
      ? '<i class="fas fa-play"></i>'
      : '<i class="fas fa-pause"></i>';
  }
  function setSongInfo(song){
    $('songTitle').textContent = song.title;
    $('curTime').textContent = '0:00';
    $('durTime').textContent = '0:00';
    $('seekFill').style.width = '0%';
  }
  function loadSong(idx, shouldPlay){
    currentIdx = ((idx % songs.length) + songs.length) % songs.length;
    const song = songs[currentIdx];
    setSongInfo(song);
    audio.src = song.url;
    if (shouldPlay){
      const p = audio.play();
      if (p && p.catch){
        p.catch(err => {
          if (err.name === 'NotAllowedError'){ updatePlayIcon(); return; }
          console.warn('Play failed:', err.name, err.message);
          if (songs.length > 1){
            toast('Bài lỗi, chuyển bài khác...');
            setTimeout(() => loadSong(currentIdx + 1, true), 1000);
          }
        });
      }
    }
  }

  audio.addEventListener('play',  updatePlayIcon);
  audio.addEventListener('pause', updatePlayIcon);
  audio.addEventListener('ended', () => {
    const next = shuffle ? Math.floor(Math.random() * songs.length) : currentIdx + 1;
    loadSong(next, true);
  });
  audio.addEventListener('error', () => {
    console.warn('Audio error, skipping...');
    if (songs.length > 1) setTimeout(() => loadSong(currentIdx + 1, true), 800);
  });
  audio.addEventListener('loadedmetadata', () => {
    $('durTime').textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    $('curTime').textContent = fmtTime(audio.currentTime);
    if (audio.duration){
      $('seekFill').style.width = ((audio.currentTime / audio.duration) * 100) + '%';
    }
  });

  $('playBtn').addEventListener('click', () => {
    if (audio.paused){
      if (!audio.src){ loadSong(currentIdx, true); return; }
      audio.play().catch(err => {
        if (err.name !== 'NotAllowedError') console.warn(err);
        updatePlayIcon();
      });
    } else {
      audio.pause();
    }
  });
  $('nextBtn').addEventListener('click', () => {
    loadSong(shuffle ? Math.floor(Math.random() * songs.length) : currentIdx + 1, true);
  });
  $('prevBtn').addEventListener('click', () => {
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    loadSong(currentIdx - 1, true);
  });
  $('shuffleBtn').addEventListener('click', () => {
    shuffle = !shuffle;
    const b = $('shuffleBtn');
    b.style.background = shuffle ? 'linear-gradient(135deg,#ec4899,#8b5cf6)' : '';
    b.style.color = shuffle ? '#fff' : '';
    toast(shuffle ? 'Phát ngẫu nhiên: BẬT 🔀' : 'Phát ngẫu nhiên: TẮT');
  });

  $('seekBar').addEventListener('click', e => {
    const rect = $('seekBar').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audio.duration && isFinite(audio.duration)) audio.currentTime = pct * audio.duration;
  });

  $('volSlider').addEventListener('input', e => {
    userVolume = parseFloat(e.target.value);
    audio.volume = userVolume;
    localStorage.setItem('dgb_volume', userVolume);
    $('volBtn').innerHTML = userVolume === 0
      ? '<i class="fas fa-volume-xmark"></i>'
      : userVolume < 0.5
        ? '<i class="fas fa-volume-low"></i>'
        : '<i class="fas fa-volume-high"></i>';
  });
  $('volBtn').addEventListener('click', () => {
    if (audio.volume > 0){
      audio._lastVol = audio.volume;
      audio.volume = 0;
      $('volSlider').value = 0;
      $('volBtn').innerHTML = '<i class="fas fa-volume-xmark"></i>';
    } else {
      audio.volume = audio._lastVol || 0.7;
      $('volSlider').value = audio.volume;
      $('volBtn').innerHTML = '<i class="fas fa-volume-high"></i>';
    }
  });

  $('musicBirthdayBtn').addEventListener('click', () => {
    songs = BIRTHDAY_SONGS.slice();
    currentIdx = 0;
    loadSong(0, true);
    toast('Đang phát nhạc sinh nhật 🎂');
  });

  // Khởi tạo: hiển thị tên bài đầu, chưa phát
  setSongInfo(songs[currentIdx]);
  audio.src = songs[currentIdx].url;

  /* ================== ACTION BUTTONS ================== */
  $('confettiBtn').addEventListener('click', () => {
    confettiOn = !confettiOn;
    const b = $('confettiBtn');
    if (confettiOn){
      b.classList.add('active');
      startConfetti();
      initParticles(120);
      toast('Bật confetti 🎊');
    } else {
      b.classList.remove('active');
      stopConfetti();
      toast('Tắt confetti');
    }
    beep(confettiOn ? 880 : 440, 0.08);
  });
  $('burstBtn').addEventListener('click', () => {
    const cx = W / 2, cy = H / 2;
    for (let i = 0; i < 3; i++){
      setTimeout(() => {
        burstAt(cx + rand(-150, 150), cy + rand(-80, 40), 50);
        beep(660 + i * 220, 0.08, 'triangle');
      }, i * 140);
    }
    toast('Bắn pháo hoa! 🎆');
  });

  /* ================== TOP ACTIONS ================== */
  $('soundToggle').addEventListener('click', () => {
    sfxOn = !sfxOn;
    const b = $('soundToggle');
    b.innerHTML = sfxOn ? '<i class="fas fa-volume-high"></i>' : '<i class="fas fa-volume-xmark"></i>';
    b.classList.toggle('off', !sfxOn);
    toast(sfxOn ? 'Bật âm thanh tương tác' : 'Tắt âm thanh tương tác');
    if (sfxOn) beep(880, 0.08);
  });

  $('shareBtn').addEventListener('click', async () => {
    const data = {
      title: `🎂 Sinh nhật ${CONFIG.name}`,
      text: `Chúc mừng sinh nhật ${CONFIG.name} — 24/05! 🎉`,
      url: location.href
    };
    try {
      if (navigator.share && /mobile/i.test(navigator.userAgent)){
        await navigator.share(data);
      } else {
        await navigator.clipboard.writeText(location.href);
        toast('Đã sao chép link chia sẻ 🔗');
      }
    } catch(e){ /* user cancel */ }
  });

  /* ================== CLICK ANYWHERE = BURST ================== */
  document.addEventListener('click', e => {
    if (e.target.closest('button,input,a,.player,.wish-box,.gift,.top-controls')) return;
    burstAt(e.clientX, e.clientY, 25);
  });

  /* ================== VISIBILITY ================== */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    } else if (confettiOn){
      startConfetti();
    }
  });

  /* ================== INIT ================== */
  let countdownInterval = null;
  function init(){
    resizeCanvas();
    initParticles(isBirthdayToday() ? 180 : 120);
    startConfetti();
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);

    if (isBirthdayToday()){
      let i = 0;
      const iv = setInterval(() => {
        burstAt(rand(100, W - 100), rand(100, H * 0.5), 30);
        if (++i > 6) clearInterval(iv);
      }, 500);
    }
  }
  init();

  window.addEventListener('pagehide', () => {
    if (countdownInterval) clearInterval(countdownInterval);
  });

  const onResize = debounce(() => {
    resizeCanvas();
    if (particles.length < 80) initParticles(120);
  }, 200);
  window.addEventListener('resize', onResize);

})();
</script>
</body>
</html>
